name: Deploy ZWEITAKT to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Check whether GitHub Pages is configured
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getPages(context.repo);
              const enabled = data.build_type === 'workflow';
              core.setOutput('enabled', String(enabled));
              if (!enabled) core.notice('Select GitHub Actions in Settings > Pages to enable deployment.');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('enabled', 'false');
              core.notice('Website built and tested. GitHub Pages needs one-time activation in Settings > Pages > GitHub Actions.');
            }
            await core.summary.addHeading('ZWEITAKT').addRaw('Tests and static build completed. The github-pages artifact contains the website. Deployment runs when Pages is configured for GitHub Actions.').write();
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
