<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">Energiefluss der ZWEITAKT-Powerbank</title><desc id="desc">Das Funktionsschema zeigt Akku, Sicherung, BMS und bidirektionale PD-Platine. Beim Entladen fließt Energie zum MacBook, beim Aufladen vom Netzteil über die Elektronik zurück zum Akku. Das BMS überwacht jede Gruppe und die Temperatur.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20241f}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#676d64}.mono{font-family:monospace;font-size:12px;fill:#676d64}.plus{fill:#cf431e}.minus{fill:#275d98}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#cf431e"/></marker></defs><rect width="1200" height="510" fill="white"/><text x="30" y="70" class="mono">ENTLADEN → NOTEBOOK VERSORGEN</text><rect x="30" y="120" width="200" height="110" rx="7" fill="#e9ece3"/><text x="130" y="165" text-anchor="middle" class="label">4S3P-AKKU</text><text x="130" y="194" text-anchor="middle" class="small" font-size="11">12 Zellen · max. 16,8 V</text><path d="M235 175 H253" stroke="#cf431e" stroke-width="3" marker-end="url(#arrow)"/><rect x="265" y="120" width="145" height="110" rx="7" fill="#f5dfd4"/><text x="337.5" y="165" text-anchor="middle" class="label">SICHERUNG</text><text x="337.5" y="194" text-anchor="middle" class="small" font-size="11">Wert nach Auslegung</text><path d="M415 175 H433" stroke="#cf431e" stroke-width="3" marker-end="url(#arrow)"/><rect x="445" y="120" width="160" height="110" rx="7" fill="#e9ece3"/><text x="525" y="165" text-anchor="middle" class="label">4S-BMS</text><text x="525" y="194" text-anchor="middle" class="small" font-size="11">Schutz & Balancing</text><path d="M610 175 H638" stroke="#cf431e" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="120" width="245" height="110" rx="7" fill="#f5dfd4"/><text x="772.5" y="165" text-anchor="middle" class="label">USB-C-PD-PLATINE</text><text x="772.5" y="194" text-anchor="middle" class="small" font-size="11">Laden + Buck-Boost-Wandler</text><path d="M900 175 H928" stroke="#cf431e" stroke-width="3" marker-end="url(#arrow)"/><rect x="940" y="120" width="230" height="110" rx="7" fill="#e9ece3"/><text x="1055" y="165" text-anchor="middle" class="label">MACBOOK</text><text x="1055" y="194" text-anchor="middle" class="small" font-size="11">bis zu 20 V / 5 A als Ziel</text><path d="M128 255 V295 H525 V255 M525 295 V333" fill="none" stroke="#396747" stroke-width="2" stroke-dasharray="6 5"/><text x="30" y="335" class="small">BMS überwacht vier Zellgruppen + Temperatur.</text><text x="30" y="360" class="small">Die Sicherung sitzt nahe am Akku; sie ist hier funktional dargestellt.</text><rect x="710" y="340" width="390" height="70" rx="7" fill="#f5f3ed"/><text x="905" y="370" text-anchor="middle" class="label">USB-C-NETZTEIL</text><text x="905" y="394" text-anchor="middle" class="small">zum Wiederaufladen statt des MacBooks</text><path d="M775 335 V250" fill="none" stroke="#cf431e" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="450" class="mono">BEIM LADEN: NETZTEIL → PD-PLATINE → GESCHÜTZTER AKKU</text><text x="30" y="483" class="small">Funktionsschema, kein Verdrahtungsplan. BMS-Leistungsanschlüsse und Abgriffe nach Herstellerunterlagen.</text></svg>